            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Program ID (URL-safe)", name: "id", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - {
                  label: "Subtitle",
                  name: "subtitle",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Program Name",
                  name: "programName",
                  widget: "string",
                  required: false,
                }
              - { label: "Age Range", name: "ageRange", widget: "string" }
              - {
                  label: "Group",
                  name: "group",
