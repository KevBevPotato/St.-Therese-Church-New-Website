# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: KevBevPotato/St.-Therese-Church-New-Website
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/0fa77363-844c-4462-9ed1-015aac8b5428/pkce
  auth_token_endpoint: /sites/0fa77363-844c-4462-9ed1-015aac8b5428/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://stthereserapidcity.org

# --- REQUIRED DECAP CMS SETTINGS ---

# Where uploaded images are saved in your repository
media_folder: "client/public/uploads"
public_folder: "/uploads"

# Content Collections (Define what files can be edited in the CMS)
collections:
  - name: "events"
    label: "Calendar Events"
    files: 
      - file: "client/src/data/events/oneTimeEvents.json"
        label: "One-Time Events"
        name: "one_time"
        fields:
          - label: "Events List"
            name: "events"
            widget: "list"
            fields:
              - { label: "Event ID", name: "id", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date (YYYY-MM-DD)", name: "date", widget: "string" }
              - { label: "Time", name: "time", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }
              - { label: "Categories", name: "categories", widget: "list", fields: [{ name: "category", label: "Category", widget: "string" }] }
              - { label: "Description", name: "description", widget: "text" }

      - file: "client/src/data/events/irregularEvents.json"
        label: "Irregular Events"
        name: "irregular"
        fields:
          - label: "Events List"
            name: "events"
            widget: "list"
            fields:
              - { label: "Event ID", name: "id", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date (YYYY-MM-DD)", name: "date", widget: "string" }
              - { label: "Time", name: "time", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }
              - { label: "Categories", name: "categories", widget: "list", fields: [{ name: "category", label: "Category", widget: "string" }] }
              - { label: "Description", name: "description", widget: "text" }

  - name: "pages"
    label: "Pages"
    files:
      - file: "client/src/data/home.json"
        label: "Home Page"
        name: "home"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
