collections:
  - name: "events"
    label: "Calendar Events"
    files:
      - file: "client/src/components/eventfolders/oneTimeEvents.json"
        label: "One-Time Events"
        name: "one_time"
        fields:
          - label: "Events List"
            name: "events"
            widget: "list"
            fields:
              - { label: "Event ID (no spaces)", name: "id", widget: "string", hint: "e.g. feeding-sd-aug-5" }
              - { label: "Title", name: "title", widget: "string", hint: "e.g. Feeding SD" }
              - { label: "Date", name: "date", widget: "string", hint: "Format: 2026-11-03T00:00:00" }
              - { label: "Time", name: "time", widget: "string", hint: "e.g. 8:00 AM - 9:00 AM" }
              - { label: "Location", name: "location", widget: "string", hint: "e.g. Main Sanctuary" }
              - label: "Event Gallery"
                name: "gallery"
                widget: "list"
                fields:
                  - { label: "Photo", name: "photo", widget: "image" }
                  - { label: "Caption", name: "caption", widget: "string", hint: "Optional description of the photo" }
              - label: "Categories"
                name: "categories"
                widget: "list"
                fields:
                  - label: "Category"
                    name: "category"
                    widget: "select"
                    options: ["sacramental", "parishEvents", "meeting", "vocations", "diocesan"]
              - { label: "Description", name: "description", widget: "text" }

      - file: "client/src/components/eventfolders/irregularEvents.json"
        label: "Irregular Events"
        name: "irregular"
        fields:
          - label: "Events List"
            name: "events"
            widget: "list"
            fields:
              - { label: "Event ID (no spaces)", name: "id", widget: "string", hint: "e.g. faith-formation-01" }
              - { label: "Title", name: "title", widget: "string", hint: "e.g. Faith Formation" }
              - { label: "Date", name: "date", widget: "string", hint: "Format: 2026-11-03T00:00:00" }
              - { label: "Time", name: "time", widget: "string", hint: "e.g. 5:30 PM - 7:30 PM" }
              - { label: "Location", name: "location", widget: "string", hint: "e.g. Community Center" }
              - label: "Event Gallery"
                name: "gallery"
                widget: "list"
                fields:
                  - { label: "Photo", name: "photo", widget: "image" }
                  - { label: "Caption", name: "caption", widget: "string", hint: "Optional description of the photo" }
              - label: "Categories"
                name: "categories"
                widget: "list"
                fields:
                  - label: "Category"
                    name: "category"
                    widget: "select"
                    options: ["sacramental", "parishEvents", "meeting", "vocations", "diocesan"]
              - { label: "Description", name: "description", widget: "text" }

  - name: "recurring_rules"
    label: "Recurring Rules"
    files:
      - file: "client/src/components/eventfolders/recurringRules.json"
        label: "Global Recurring Rules"
        name: "rules_file"
        fields:
          - label: "Rules List"
            name: "rules"
            widget: "list"
            fields:
              - { label: "Rule ID (no spaces)", name: "id", widget: "string", hint: "e.g. connect-groups" }
              - { label: "Event Title", name: "title", widget: "string", hint: "e.g. Connect Groups" }
              - { label: "Time", name: "time", widget: "string", hint: "e.g. 6:00 PM - 7:30 PM" }
              - { label: "Location", name: "location", widget: "string", hint: "e.g. St. Therese Rectory" }
              - label: "Event Gallery"
                name: "gallery"
                widget: "list"
                fields:
                  - { label: "Photo", name: "photo", widget: "image" }
                  - { label: "Caption", name: "caption", widget: "string", hint: "Optional description of the photo" }
              
              # NEW: Recurrence Type
              - label: "Recurrence Type"
                name: "recurrenceType"
                widget: "select"
                options: ["weekly", "monthly"]
                hint: "Weekly = every single [Day]. Monthly = only the 1st, 2nd, 3rd etc."

              - { label: "Day of Week (0=Sun, 1=Mon, 2=Tue...)", name: "dayOfWeek", widget: "number", hint: "e.g. 1 for Monday" }
              
              # NEW: Ordinal selection for Monthly
              - label: "Which Week of Month? (If Monthly)"
                name: "ordinalWeek",
                widget: "select",
                options: ["1", "2", "3", "4", "5"],
                hint: "Leave blank if Weekly. Select '3' for the 3rd Monday of the month."

              - { label: "Start Date", name: "startDate", widget: "string", hint: "Format: 2026-10-05T00:00:00" }
              - { label: "End Date", name: "endDate", widget: "string", hint: "Format: 2027-04-05T00:00:00" }
              - { label: "Exclusions (comma separated)", name: "exclusions", widget: "string", hint: "e.g. 2026-11-16, 2026-12-21" }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Categories"
                name: "categories"
                widget: "list"
                fields:
                  - label: "Category"
                    name: "category"
                    widget: "select"
                    options: ["sacramental", "parishEvents", "meeting", "vocations", "diocesan"]
