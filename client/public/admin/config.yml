# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: KevBevPotato/St.-Therese-Church-New-Website
  branch: Website-View
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/0fa77363-844c-4462-9ed1-015aac8b5428/pkce
  auth_token_endpoint: /sites/0fa77363-844c-4462-9ed1-015aac8b5428/token
  gateway_url: https://gateway.decapbridge.com

commit_messages:
  create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
  update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
  delete: Delete {{collection}} “{{slug}}” - {{// author-name}} <{{author-login}}> via DecapBridge
  uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
  deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
  openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://stthereserapidcity.org
media_folder: "client/public/uploads"
public_folder: "/uploads"

collections:
  - name: "events"
    label: "One-Time Calendar Events"
    files:
      - file: "client/src/components/eventfolders/oneTimeEvents.json"
        label: "One-Time Calendar Events"
        name: "one_time"
        fields:
          - label: "Events List"
            name: "events"
            widget: "list"
            fields:
              - { label: "Event ID (no spaces)", name: "id", widget: "string", hint: "e.g. feeding-sd-aug-5" }
              - { label: "Title", name: "title", widget: "string", hint: "e.g. Feeding SD" }
              - { label: "Date", name: "date", widget: "string", hint: "Format: 2026-11-03" }
              - { label: "Time", name: "time", widget: "string", hint: "e.g. 8:00 AM - 9:00 AM" }
              - { label: "Location", name: "location", widget: "string", hint: "e.g. Main Sanctuary" }
              - label: "Event Gallery (Optional)"
                name: "gallery"
                widget: "list"
                fields:
                  - { label: "Photo", name: "photo", widget: "image" }
                  - { label: "Caption", name: "caption", widget: "string", hint: "Optional description of the photo" }
              - label: "Categories"
                name: "categories"
                widget: "list"
                fields:
                  - label: "Category"
                    name: "category"
                    widget: "select"
                    options: ["sacramental", "parishEvents", "meeting", "vocations", "diocesan"]
              - { label: "Description (Optional)", name: "description", widget: "text" }

  - name: "recurring_rules"
    label: "Recurring Events for St. Therese"
    files:
      - file: "client/src/components/eventfolders/recurringRules.json"
        label: "Recurring Events"
        name: "rules_file"
        fields:
          - label: "Rules List"
            name: "rules"
            widget: "list"
            fields:
              - { label: "Rule ID (no spaces)", name: "id", widget: "string", hint: "e.g. connect-groups-sep-25-2026" }
              - { label: "Event Title", name: "title", widget: "string", hint: "e.g. Connect Groups" }
              - { label: "Time", name: "time", widget: "string", hint: "e.g. 6:00 PM - 7:30 PM" }
              - { label: "Location", name: "location", widget: "string", hint: "e.g. St. Therese Rectory" }
              - label: "Event Gallery (Optional)"
                name: "gallery"
                widget: "list"
                fields:
                  - { label: "Photo", name: "photo", widget: "image" }
                  - { label: "Caption", name: "caption", widget: "string", hint: "Optional description of the photo" }
              - { label: "Recurrence Type", name: "recurrenceType", widget: "select", options: ["daily", "weekly", "monthly", "last_of_month"], hint: "Daily = every day. Weekly = same day each week. Monthly = e.g. 3rd Monday. Last of Month = Last [Day] of the month." }
              - label: "Day of Week"
                name: "dayOfWeek"
                widget: "select"
                options: ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"]
                hint: "Ignore if Daily."
              - { label: "Which Week of Month? (If Monthly)", name: "ordinalWeek", widget: "select", options: ["1", "2", "3", "4", "5"], hint: "Ignore if Daily/Weekly. '3' = 3rd week of month." }
              - { label: "Start Date", name: "startDate", widget: "string", hint: "Format: 2026-10-05" }
              - { label: "End Date (Leave blank for Perpetual)", name: "endDate", widget: "string", hint: "Format: 2027-04-05" }
              - label: "Exclusions (Optional)"
                name: "exclusions"
                widget: "list"
                fields:
                  - { label: "Exclude Date", name: "date", widget: "string", hint: "Format: 2026-11-16" }
              - { label: "Description (Optional)", name: "description", widget: "text" }
              - label: "Categories"
                name: "categories"
                widget: "list"
                fields:
                  - label: "Category"
                    name: "category"
                    widget: "select"
                    options: ["sacramental", "parishEvents", "meeting", "vocations", "diocesan"]

  - name: "bulletins"
    label: "Parish Bulletins"
    files:
      - file: "client/src/data/bulletins_data.json"
        label: "Weekly Bulletins"
        name: "bulletins_file"
        fields:
          - label: "Bulletins List"
            name: "bulletins"
            widget: "list"
            fields: # <--- THIS WAS THE MISSING LINE
              - { label: "Bulletin Title", name: "title", widget: "string", required: true, hint: "e.g., Oct 12 - Oct 19, 2024" }
              - { label: "Start Date", name: "startDate", widget: "string", required: true, hint: "Format: YYYY-MM-DD (Must be a Saturday)" }
              - { label: "End Date", name: "endDate", widget: "string", required: true, hint: "Format: YYYY-MM-DD (Must be a Saturday)" }
              - { label: "PDF Upload", name: "pdfUrl", widget: "file", required: false, hint: "Optional - leave blank if not yet available" }
              - { label: "Mass Times", name: "mass_times", widget: "markdown", required: false }
              - { label: "Announcements", name: "announcements", widget: "markdown", required: false }
              - { label: "New Parishioners", name: "new_parishioners", widget: "markdown", required: false }
              - { label: "Mass Intentions", name: "mass_intentions", widget: "markdown", required: false }
              - { label: "Daily Scriptures", name: "daily_scriptures", widget: "markdown", required: false }
              - { label: "Lectors", name: "lectors", widget: "markdown", required: false }
              - { label: "Ushers", name: "ushers", widget: "markdown", required: false }
              - { label: "Altar Servers", name: "altar_servers", widget: "markdown", required: false }
              - { label: "Contributions", name: "contributions", widget: "markdown", required: false }
              - { label: "Prayer List", name: "prayer_list", widget: "markdown", required: false }
              - { label: "A Little Laugh", name: "a_little_laugh", widget: "markdown", required: false }
              - { label: "Needs", name: "needs", widget: "markdown", required: false }
              - { label: "Sponsors", name: "sponsors", widget: "markdown", required: false }
