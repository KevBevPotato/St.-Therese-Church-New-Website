# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: KevBevPotato/St.-Therese-Church-New-Website
  branch: Website-View
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/0fa77363-844c-4462-9ed1-015aac8b5428/pkce
  auth_token_endpoint: /sites/0fa77363-844c-4462-9ed1-015aac8b5428/token
  gateway_url: https://gateway.decapbridge.com

commit_messages:
  create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
  update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
  delete: Delete {{collection}} “{{slug}}” - {{// author-name}} <{{author-login}}> via DecapBridge
  uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
  deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
  openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://stthereserapidcity.org
media_folder: "client/public/uploads"
public_folder: "/uploads"

collections:
  - name: "homepage"
    label: "Home Page"
    files:
      - file: "client/src/data/hero_data.json"
        label: "Hero Video & Text Options"
        name: "hero_video"
        fields:
          - {
              label: "Hero Video File or URL",
              name: "videoUrl",
              widget: "file",
              required: false,
              hint: "Upload an MP4 or choose an existing video. Leave blank to show the poster image only.",
            }
          - {
              label: "Fallback Poster Image",
              name: "poster",
              widget: "image",
              required: false,
            }
          - {
              label: "Media Fit",
              name: "mediaFit",
              widget: "select",
              options:
                [
                  {
                    label: "Cover — fills the hero; edges may be cropped",
                    value: "cover",
                  },
                  {
                    label: "Contain — shows the whole image; may leave empty space",
                    value: "contain",
                  },
                ],
              default: "cover",
              hint: "Controls how the video or poster fits inside the hero area.",
            }
          - {
              label: "Media Position",
              name: "mediaPosition",
              widget: "select",
              options: ["center", "top", "bottom", "left", "right"],
              default: "center",
              hint: "Choose which part stays visible when Media Fit is set to Cover.",
            }
          - {
              label: "Background Color",
              name: "backgroundColor",
              widget: "color",
              default: "#102a45",
              hint: "Shown behind the media, especially when it is set to Contain.",
            }
          - {
              label: "Overlay Color",
              name: "overlayColor",
              widget: "color",
              default: "#102a45",
              hint: "Tint placed over the media to keep the text readable.",
            }
          - {
              label: "Overlay Strength",
              name: "overlayStrength",
              widget: "number",
              value_type: "float",
              min: 0,
              max: 1,
              step: 0.05,
              default: 0.9,
              hint: "0 is transparent; 1 is strongest. Increase it if the text is hard to read.",
            }
          - {
              label: "Text Color",
              name: "textColor",
              widget: "color",
              default: "#ffffff",
            }
          - {
              label: "Accent Color",
              name: "accentColor",
              widget: "color",
              default: "#f1d99d",
            }
          - {
              label: "Accent Border Color",
              name: "accentBorderColor",
              widget: "color",
              default: "#d4b36a",
            }
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Headline", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - {
              label: "Primary Button Label",
              name: "primaryButtonLabel",
              widget: "string",
            }
          - {
              label: "Primary Button URL",
              name: "primaryButtonUrl",
              widget: "string",
            }
          - {
              label: "Secondary Button Label",
              name: "secondaryButtonLabel",
              widget: "string",
            }
          - {
              label: "Secondary Button URL",
              name: "secondaryButtonUrl",
              widget: "string",
            }
          - { label: "Quote", name: "quote", widget: "string" }
          - {
              label: "Quote Attribution",
              name: "quoteAttribution",
              widget: "string",
            }
      - file: "client/src/data/home_contact_data.json"
        label: "Contact Info"
        name: "home_contact"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Headline", name: "title", widget: "string" }
          - { label: "Introduction", name: "description", widget: "text" }
          - { label: "Office Hours", name: "officeHours", widget: "string" }
          - { label: "Phone Display", name: "phone", widget: "string" }
          - {
              label: "Phone Link Number",
              name: "phoneLink",
              widget: "string",
              hint: "Digits and optional leading +, e.g. +16053421556.",
            }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Address", name: "address", widget: "string" }
  - name: "staff"
    label: "About & Staff"
    files:
      - file: "client/src/data/staff_data.json"
        label: "Staff Directory"
        name: "staff_file"
        fields:
          - label: "Staff Members"
            name: "staff"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - {
                  label: "Full Name",
                  name: "name",
                  widget: "string",
                  required: true,
                } # MOVED TO TOP
              - {
                  label: "Hide from Directory",
                  name: "isHidden",
                  widget: "boolean",
                  defaultValue: false,
                }
              - {
                  label: "Slug (no spaces, e.g. kevin-baltzer)",
                  name: "slug",
                  widget: "string",
                  required: true,
                }
              - label: "Titles"
                name: "titles"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Phone", name: "phone", widget: "string" }
              - { label: "Office Room", name: "officeRoom", widget: "string" }
              - label: "Categories"
                name: "categories"
                widget: "list"
                fields:
                  - label: "Category"
                    name: "category"
                    widget: "select"
                    options:
                      [
                        "clergy",
                        "staff",
                        "catechist",
                        "council",
                        "music",
                        "ministries",
                      ]
              - { label: "Photo", name: "photo", widget: "image" }
              - {
                  label: "Photo Position (e.g. center 25%)",
                  name: "photoPosition",
                  widget: "string",
                }
              - {
                  label: "Photo Fit",
                  name: "photoFit",
                  widget: "select",
                  options: ["cover", "contain"],
                }
              - { label: "Duties", name: "duties", widget: "text" }
              - { label: "Bio", name: "bio", widget: "text" }
      - file: "client/src/data/about_page_data.json"
        label: "About Page Text"
        name: "about_page_text"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Headline", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - { label: "Quote", name: "quote", widget: "text" }
          - {
              label: "Quote Attribution",
              name: "quoteAttribution",
              widget: "string",
            }
  - name: "one_time_events"
    label: "Parish Events · One-Time Events"
    folder: "client/src/components/eventfolders/one-time-events"
    create: true
    extension: "json"
    format: "json"
    summary: "{{title}} · {{date}}"
    sortable_fields:
      - field: "date"
        label: "Event date (oldest/newest)"
        default_sort: "asc"
    fields:
      - {
          label: "Event ID (no spaces)",
          name: "id",
          widget: "string",
          hint: "Keep this unique and stable; it is used in the event URL.",
        }
      - { label: "Title", name: "title", widget: "string" }
      - {
          label: "Date",
          name: "date",
          widget: "date",
          format: "YYYY-MM-DD",
          date_format: "YYYY-MM-DD",
          picker_utc: false,
        }
      - { label: "Time", name: "time", widget: "string" }
      - { label: "Location", name: "location", widget: "string" }
      - label: "Categories"
        name: "categories"
        widget: "list"
        fields:
          - label: "Category"
            name: "category"
            widget: "select"
            options:
              [
                "sacramental",
                "parishEvents",
                "meeting",
                "vocations",
                "diocesan",
              ]
      - label: "Organization Calendars (Optional)"
        name: "organizationTags"
        widget: "list"
        field:
          label: "Organization"
          name: "organization"
          widget: "select"
          options:
            - { label: "Knights of Columbus", value: "knights-of-columbus" }
            - { label: "Altar Society", value: "altar-society" }
            - { label: "Catholic Daughters", value: "catholic-daughters" }
            - { label: "St. Vincent de Paul", value: "st-vincent-de-paul" }
            - { label: "Faith Formation", value: "faith-formation" }
      - {
          label: "Description",
          name: "description",
          widget: "text",
          required: false,
        }
      - {
          label: "About this event",
          name: "about",
          widget: "text",
          required: false,
        }
      - { label: "Hero Image", name: "image", widget: "image", required: false }
      - {
          label: "Sign-up URL",
          name: "signupLink",
          widget: "string",
          required: false,
        }
      - {
          label: "Contact Person",
          name: "contactPerson",
          widget: "string",
          required: false,
        }
      - {
          label: "Contact Email",
          name: "contactEmail",
          widget: "string",
          required: false,
        }
      - {
          label: "Contact Phone",
          name: "contactPhone",
          widget: "string",
          required: false,
        }
      - label: "Event Gallery (Optional)"
        name: "gallery"
        widget: "list"
        required: false
        fields:
          - { label: "Photo", name: "photo", widget: "image" }
          - {
              label: "Caption",
              name: "caption",
              widget: "string",
              required: false,
            }
          - {
              label: "Link URL (optional)",
              name: "linkUrl",
              widget: "string",
              required: false,
              hint: "Use a site path such as /about or a full https:// URL. Leave blank to open the photo.",
            }
      - label: "Frequently Asked Questions (Optional)"
        name: "faqItems"
        widget: "list"
        required: false
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Answer", name: "answer", widget: "text" }

  - name: "recurring_events"
    label: "Parish Events · Recurring Events"
    folder: "client/src/components/eventfolders/recurring-events"
    create: true
    extension: "json"
    format: "json"
    summary: "{{title}}"
    sortable_fields:
      - field: "schedule.startDate"
        label: "Schedule start date (oldest/newest)"
        default_sort: "asc"
    fields:
      - {
          label: "Rule ID (no spaces)",
          name: "id",
          widget: "string",
          hint: "Keep this unique and stable; it is used to create event URLs.",
        }
      - { label: "Event Title", name: "title", widget: "string" }
      - { label: "Time", name: "time", widget: "string" }
      - { label: "Location", name: "location", widget: "string" }
      - label: "Schedule and Occurrences"
        name: "schedule"
        widget: "recurrence-schedule"
        hint: "Choose a date range and pattern. Uncheck Include beside a generated date to exclude it."
      - {
          label: "Description",
          name: "description",
          widget: "text",
          required: false,
        }
      - label: "Categories"
        name: "categories"
        widget: "list"
        fields:
          - label: "Category"
            name: "category"
            widget: "select"
            options:
              [
                "sacramental",
                "parishEvents",
                "meeting",
                "vocations",
                "diocesan",
              ]
      - label: "Organization Calendars (Optional)"
        name: "organizationTags"
        widget: "list"
        field:
          label: "Organization"
          name: "organization"
          widget: "select"
          options:
            - { label: "Knights of Columbus", value: "knights-of-columbus" }
            - { label: "Altar Society", value: "altar-society" }
            - { label: "Catholic Daughters", value: "catholic-daughters" }
            - { label: "St. Vincent de Paul", value: "st-vincent-de-paul" }
            - { label: "Faith Formation", value: "faith-formation" }
      - label: "Event Gallery (Optional)"
        name: "gallery"
        widget: "list"
        required: false
        fields:
          - { label: "Photo", name: "photo", widget: "image" }
          - {
              label: "Caption",
              name: "caption",
              widget: "string",
              required: false,
            }
          - {
              label: "Link URL (optional)",
              name: "linkUrl",
              widget: "string",
              required: false,
              hint: "Use a site path such as /about or a full https:// URL. Leave blank to open the photo.",
            }

  - name: "bulletins"
    label: "Parish Bulletins"
    files:
      - file: "client/src/data/bulletins_data.json"
        label: "Weekly Bulletins"
        name: "bulletins_file"
        fields:
          - label: "Bulletins List"
            name: "bulletins"
            widget: "list"
            fields: # <--- THIS WAS THE MISSING LINE
              - {
                  label: "Bulletin Title",
                  name: "title",
                  widget: "string",
                  required: true,
                  hint: "e.g., Oct 12 - Oct 19, 2024",
