# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: KevBevPotato/St.-Therese-Church-New-Website
  branch: Website-View
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/0fa77363-844c-4462-9ed1-015aac8b5428/pkce
  auth_token_endpoint: /sites/0fa77363-844c-4462-9ed1-015aac8b5428/token
  gateway_url: https://gateway.decapbridge.com

commit_messages:
  create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
  update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
  delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
  uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
  deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
  openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://stthereserapidcity.org
media_folder: "client/public/uploads"
public_folder: "/uploads"

collections:
  - name: "events"
    label: "Calendar Events"
    files:
      - file: "client/src/components/eventfolders/oneTimeEvents.json"
        label: "One-Time Events"
        name: "one_time"
        fields:
          - label: "Events List"
            name: "events"
            widget: "list"
            fields:
              - { label: "Event ID (no spaces)", name: "id", widget: "string", hint: "e.g. feeding-sd-aug-5" }
              - { label: "Title", name: "title", widget: "string", hint: "e.g. Feeding SD" }
              - { label: "Date", name: "date", widget: "string", hint: "Format: 2026-11-03T00:00:00" }
              - { label: "Time", name: "time", widget: "string", hint: "e.g. 8:00 AM - 9:00 AM" }
              - { label: "Location", name: "location", widget: "string", hint: "e.g. Main Sanctuary" }
              - label: "Event Gallery"
                name: "gallery"
                widget: "list"
                fields:
                  - { label: "Photo", name: "photo", widget: "image" }
                  - { label: "Caption", name: "caption", widget: "string", hint: "Optional description of the photo" }
              - label: "Categories"
                name: "categories"
                widget: "list"
                fields:
                  - label: "Category"
                    name: "category"
                    widget: "select"
                    options: ["sacramental", "parishEvents", "meeting", "vocations", "diocesan"]
              - { label: "Description", name: "description", widget: "text" }

      - file: "client/src/components/eventfolders/irregularEvents.json"
        label: "Irregular Events"
        name: "irregular"
        fields:
          - label: "Events List"
            name: "events"
            widget: "list"
            fields:
              - { label: "Event ID (no spaces)", name: "id", widget: "string", hint: "e.g. faith-formation-01" }
              - { label: "Title", name: "title", widget: "string", hint: "e.g. Faith Formation" }
              - { label: "Date", name: "date", widget: "string", hint: "Format: 2026-11-03T00:00:00" }
              - { label: "Time", name: "time", widget: "string", hint: "e.g. 5:30 PM - 7:30 PM" }
              - { label: "Location", name: "location", widget: "string", hint: "e.g. Community Center" }
              - label: "Event Gallery"
                name: "gallery"
                widget: "list"
                fields:
                  - { label: "Photo", name: "photo", widget: "image" }
                  - { label: "Caption", name: "caption", widget: "string", hint: "Optional description of the photo" }
              - label: "Categories"
                name: "categories"
                widget: "list"
                fields:
                  - label: "Category"
                    name: "category"
                    widget: "select"
                    options: ["sacramental", "parishEvents", "meeting", "vocations", "diocesan"]
              - { label: "Description", name: "description", widget: "text" }

  - name: "recurring_rules"
    label: "Recurring Rules"
    files:
      - file: "client/src/components/eventfolders/recurringRules.json"
        label: "Global Recurring Rules"
        name: "rules_file"
        fields:
          - label: "Rules List"
            name: "rules"
            widget: "list"
            fields:
              - { label: "Rule ID (no spaces)", name: "id", widget: "string", hint: "e.g. connect-groups" }
              - { label: "Event Title", name: "title", widget: "string", hint: "e.g. Connect Groups" }
              - { label: "Time", name: "time", widget: "string", hint: "e.g. 6:00 PM - 7:30 PM" }
              - { label: "Location", name: "location", widget: "string", hint: "e.g. St. Therese Rectory" }
              - label: "Event Gallery"
                name: "gallery"
                widget: "list"
                fields:
                  - { label: "Photo", name: "photo", widget: "image" }
                  - { label: "Caption", name: "caption", widget: "string", hint: "Optional description of the photo" }
              - { label: "Day of Week (0=Sun, 1=Mon, 2=Tue...)", name: "dayOfWeek", widget: "number", hint: "e.g. 1" }
              - { label: "Start Day of Month", name: "startDayOfMonth", widget: "number", hint: "e.g. 15" }
              - { label: "End Day of Month", name: "endDayOfMonth", widget: "number", hint: "e.g. 21" }
              - { label: "Start Date (YYYY-MM-DD)", name: "startDate", widget: "string", hint: "Earliest date this rule applies" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Start Date", name: "startDate", widget: "string", hint: "YYYY-MM-DDT00:00:00" }
              - { label: "End Date", name: "endDate", widget: "string", hint: "YYYY-MM-DDT00:00:00" }
              - { label: "Exclusions (comma separated)", name: "exclusions", widget: "string", hint: "e.g. 2026-11-16, 2026-12-21" }
              - label: "Categories"
                name: "categories"
                widget: "list"
                fields:
                  - label: "Category"
                    name: "category"
                    widget: "select"
                    options: ["sacramental", "parishEvents", "meeting", "vocations", "diocesan"]
