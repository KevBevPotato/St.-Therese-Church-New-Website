              - {
                  label: "Start Date",
                  name: "startDate",
                  widget: "date",
                  format: "YYYY-MM-DD",
                  date_format: "YYYY-MM-DD",
                  picker_utc: false,
                  required: true,
                  hint: "Choose the Saturday that begins this bulletin week.",
                }
              - {
                  label: "End Date",
                  name: "endDate",
                  widget: "date",
                  format: "YYYY-MM-DD",
                  date_format: "YYYY-MM-DD",
