                          "Calendar",
                          "Church",
                          "FileText",
                          "GraduationCap",
                          "Heart",
                          "HelpCircle",
                          "Phone",
                          "Shield",
                          "Users",
                        ],
                      default: "BookOpen",
                    }
                  - label: "Background Image Appearance"
                    name: "imageSettings"
                    widget: "object"
                    required: false
                    fields:
                      - {
                          label: "Image Size",
                          name: "scale",
                          widget: "select",
                          options:
                            [
                              "scale-100",
                              "scale-110",
                              "scale-125",
                              "scale-150",
                            ],
                          default: "scale-100",
                        }
                      - {
                          label: "Image Transparency",
                          name: "opacity",
                          widget: "select",
                          options:
                            [
                              "opacity-10",
                              "opacity-20",
                              "opacity-30",
                              "opacity-40",
                              "opacity-60",
                            ],
                          default: "opacity-40",
                        }
                      - {
                          label: "Image Position",
                          name: "position",
                          widget: "select",
                          options:
                            [
                              "object-center",
                              "object-top",
                              "object-bottom",
                              "object-left",
                              "object-right",
                            ],
                          default: "object-center",
                        }
                      - {
                          label: "Background Blur",
                          name: "blur",
                          widget: "select",
                          options:
                            [
                              "backdrop-blur-none",
                              "backdrop-blur-[2px]",
                              "backdrop-blur-sm",
                              "backdrop-blur-md",
                              "backdrop-blur-lg",
                            ],
                          default: "backdrop-blur-[2px]",
                        }
                  - label: "Logo Appearance"
                    name: "logoSettings"
                    widget: "object"
                    required: false
                    fields:
                      - {
                          label: "Logo Size",
                          name: "scale",
                          widget: "select",
                          options:
                            [
                              "size-8",
                              "size-10",
                              "size-12",
                              "size-14",
                              "size-16",
                            ],
                          default: "size-12",
                        }
                      - {
                          label: "Logo Shape",
                          name: "rounded",
                          widget: "select",
                          options:
                            [
                              "rounded-none",
                              "rounded-sm",
                              "rounded-md",
                              "rounded-lg",
                              "rounded-xl",
                              "rounded-2xl",
                              "rounded-full",
                            ],
                          default: "rounded-xl",
                        }
                      - {
                          label: "Logo Border",
                          name: "border",
                          widget: "select",
                          options:
                            [
                              "border-none",
                              "border-primary/10",
                              "border-white",
                              "border-accent",
                            ],
                          default: "border-primary/10",
                        }
                      - {
                          label: "Logo Opacity",
                          name: "opacity",
                          widget: "select",
                          options: ["opacity-50", "opacity-80", "opacity-100"],
                          default: "opacity-100",
                        }
  - name: "faith_formation"
    label: "Faith Formation"
    files:
      - file: "client/src/data/faith-formation.json"
        label: "Wednesday Faith Formation Programs"
        name: "faith_formation_file"
