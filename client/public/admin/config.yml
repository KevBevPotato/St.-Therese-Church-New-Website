# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: KevBevPotato/St.-Therese-Church-New-Website
  branch: Website-View
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/0fa77363-844c-4462-9ed1-015aac8b5428/pkce
  auth_token_endpoint: /sites/0fa77363-844c-4462-9ed1-015aac8b5428/token
  gateway_url: https://gateway.decapbridge.com

commit_messages:
  create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
  update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
  delete: Delete {{collection}} “{{slug}}” - {{// author-name}} <{{author-login}}> via DecapBridge
  uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
  deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
  openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://stthereserapidcity.org
media_folder: "client/public/uploads"
public_folder: "/uploads"

collections:
  - name: "homepage"
    label: "Home Page"
    files:
      - file: "client/src/data/hero_data.json"
        label: "Hero Video & Text Options"
        name: "hero_video"
        fields:
          - {
              label: "Hero Video File or URL",
              name: "videoUrl",
              widget: "file",
              required: false,
              hint: "Upload an MP4 or choose an existing video. Leave blank to show the poster image only.",
            }
          - {
              label: "Fallback Poster Image",
              name: "poster",
              widget: "image",
              required: false,
            }
          - {
              label: "Desktop Video File or URL",
              name: "desktopVideoUrl",
              widget: "file",
              required: false,
              hint: "Shown on tablet and desktop screens. Leave blank to use the original Hero Video File or URL.",
            }
          - {
              label: "Desktop Poster Image",
              name: "desktopPoster",
              widget: "image",
              required: false,
              hint: "Shown on tablet and desktop screens when video is unavailable.",
            }
          - {
              label: "Mobile Video File or URL",
              name: "mobileVideoUrl",
              widget: "file",
              required: false,
              hint: "Shown on phones. Leave blank to use the desktop video.",
            }
          - {
              label: "Mobile Poster Image",
              name: "mobilePoster",
              widget: "image",
              required: false,
              hint: "Shown on phones when the mobile video is unavailable.",
            }
          - {
              label: "Media Fit",
              name: "mediaFit",
              widget: "select",
              options:
                [
                  {
                    label: "Cover — fills the hero; edges may be cropped",
                    value: "cover",
                  },
                  {
                    label: "Contain — shows the whole image; may leave empty space",
                    value: "contain",
                  },
                ],
              default: "cover",
              hint: "Controls how the video or poster fits inside the hero area.",
              required: false,
            }
          - {
              label: "Video Focal Point",
              name: "mediaPosition",
              widget: "video-focal-point",
              default: "center",
              hint: "Upload a video and choose its focal point, or edit the focal point of the current homepage video.",
              required: false,
            }
          - {
              label: "Background Color",
              name: "backgroundColor",
              widget: "color",
              default: "#102a45",
              hint: "Shown behind the media, especially when it is set to Contain.",
              required: false,
            }
          - {
              label: "Overlay Color",
              name: "overlayColor",
              widget: "color",
              default: "#102a45",
              hint: "Tint placed over the media to keep the text readable.",
              required: false,
            }
          - {
              label: "Overlay Strength",
              name: "overlayStrength",
              widget: "number",
              value_type: "float",
              min: 0,
              max: 1,
              step: 0.05,
              default: 0.9,
              hint: "0 is transparent; 1 is strongest. Increase it if the text is hard to read.",
              required: false,
            }
          - {
              label: "Text Color",
              name: "textColor",
              widget: "color",
              default: "#ffffff",
              required: false,
            }
          - {
              label: "Accent Color",
              name: "accentColor",
              widget: "color",
              default: "#f1d99d",
              required: false,
            }
          - {
              label: "Accent Border Color",
              name: "accentBorderColor",
              widget: "color",
              default: "#d4b36a",
              required: false,
            }
          - { label: "Eyebrow", name: "eyebrow", widget: "markdown" , required: false }
          - { label: "Headline", name: "title", widget: "markdown" , required: false }
          - { label: "Description", name: "description", widget: "markdown" , required: false }
          - {
              label: "Primary Button Label",
              name: "primaryButtonLabel",
              widget: "markdown",
              hint: "This button opens the parish membership registration form.",
              required: false,
            }
          - {
              label: "Secondary Button Label",
              name: "secondaryButtonLabel",
              widget: "markdown",
              required: false,
            }
          - {
              label: "Secondary Button URL",
              name: "secondaryButtonUrl",
              widget: "string",
              required: false,
            }
          - {
              label: "Show Monthly Calendar PDF Buttons",
              name: "showMonthlyCalendarButtons",
              widget: "boolean",
              default: true,
              required: false,
              hint: "Turn this off to hide the dated PDF buttons. The archive button is controlled separately.",
            }
          - {
              label: "Monthly Calendar Archive Button Label",
              name: "monthlyCalendarArchiveLabel",
              widget: "string",
              default: "View Monthly PDF Archive",
              required: false,
            }
          - {
              label: "Monthly Calendar Archive URL",
              name: "monthlyCalendarArchiveUrl",
              widget: "string",
              required: false,
              hint: "Optional destination for the archive button. Leave blank to use the monthly calendar archive page.",
            }
          - label: "Monthly Calendar PDFs"
            name: "monthlyCalendarPdfs"
            widget: "list"
            required: false
            summary: "{{fields.label}} ({{fields.startDate}} to {{fields.endDate}})"
            hint: "Add PDFs in the order you want them shown. Up to two PDFs that have not expired appear as buttons; expired PDFs remain available in the archive."
            fields:
              - { label: "Button Label", name: "label", widget: "string", required: true }
              - {
                  label: "PDF Upload",
                  name: "pdfUrl",
                  widget: "file",
                  required: true,
                }
              - {
                  label: "Start Date",
                  name: "startDate",
                  widget: "datetime",
                  format: "YYYY-MM-DD",
                  date_format: "YYYY-MM-DD",
                  time_format: false,
                  picker_utc: false,
                  required: true,
                  hint: "First date this PDF should be shown.",
                }
              - {
                  label: "End Date",
                  name: "endDate",
                  widget: "datetime",
                  format: "YYYY-MM-DD",
                  date_format: "YYYY-MM-DD",
                  time_format: false,
                  picker_utc: false,
                  required: true,
                  hint: "Last date this PDF should be shown.",
                }
          - { label: "Quote", name: "quote", widget: "markdown" , required: false }
          - {
              label: "Quote Attribution",
              name: "quoteAttribution",
              widget: "markdown",
              required: false,
            }
      - file: "client/src/data/home_contact_data.json"
        label: "Contact Info"
        name: "home_contact"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "markdown" , required: false }
          - { label: "Headline", name: "title", widget: "markdown" , required: false }
          - { label: "Introduction", name: "description", widget: "markdown" , required: false }
          - { label: "Office Hours", name: "officeHours", widget: "markdown" , required: false }
          - { label: "Phone Display", name: "phone", widget: "string" , required: false }
          - {
              label: "Phone Link Number",
              name: "phoneLink",
              widget: "string",
              hint: "Digits and optional leading +, e.g. +16053421556.",
              required: false,
            }
          - { label: "Email", name: "email", widget: "string" , required: false }
          - { label: "Address", name: "address", widget: "markdown" , required: false }
  - name: "navigation"
    label: "Header Navigation"
    files:
      - file: "client/src/data/header_data.json"
        label: "Header Links and Branches"
        name: "header_navigation"
        fields:
          - label: "Primary Links"
            name: "primaryLinks"
            widget: "list"
            required: false
            summary: "{{fields.label}}"
            fields:
              - { label: "Label", name: "label", widget: "markdown", required: false }
              - { label: "URL", name: "href", widget: "string", required: false }
          - label: "Parish Life Links"
            name: "parishLifeLinks"
            widget: "list"
            required: false
            summary: "{{fields.label}}"
            hint: "Leave URL blank to create a branch heading. Add nested links under Children."
            fields:
              - { label: "Label", name: "label", widget: "markdown", required: false }
              - { label: "URL", name: "href", widget: "string", required: false }
              - label: "Children"
                name: "children"
                widget: "list"
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { label: "Label", name: "label", widget: "markdown", required: false }
                  - { label: "URL", name: "href", widget: "string", required: false }
                  - label: "Children"
                    name: "children"
                    widget: "list"
                    required: false
                    fields:
                      - { label: "Label", name: "label", widget: "markdown", required: false }
                      - { label: "URL", name: "href", widget: "string", required: false }
          - label: "External Links"
            name: "externalLinks"
            widget: "list"
            required: false
            summary: "{{fields.label}}"
            fields:
              - { label: "Label", name: "label", widget: "markdown", required: false }
              - { label: "URL", name: "href", widget: "string", required: false }
          - {
              label: "Donate URL",
              name: "donateUrl",
              widget: "string",
              required: false,
            }
  - name: "staff"
    label: "About & Staff"
    files:
      - file: "client/src/data/staff_data.json"
        label: "Staff Directory"
        name: "staff_file"
        fields:
          - label: "Staff Members"
            name: "staff"
            widget: "list"
            required: false
            summary: "{{fields.name}}"
            fields:
              - {
                  label: "Full Name",
                  name: "name",
                  widget: "markdown",
                  required: false,
                } # MOVED TO TOP
              - {
                  label: "Hide from Directory",
                  name: "isHidden",
                  widget: "boolean",
                  defaultValue: false,
                  required: false,
                }
              - {
                  label: "Slug (no spaces, e.g. kevin-baltzer)",
                  name: "slug",
                  widget: "string",
                  required: false,
                }
              - label: "Titles"
                name: "titles"
                widget: "list"
                required: false
                fields:
                  - {
                      label: "Hide this title",
                      name: "isHidden",
                      widget: "boolean",
                      default: false,
                      required: false,
                    }
                  - { label: "Title", name: "title", widget: "markdown" , required: false }
              - { label: "Email", name: "email", widget: "string" , required: false }
              - { label: "Phone", name: "phone", widget: "string" , required: false }
              - { label: "Office Room", name: "officeRoom", widget: "string" , required: false }
              - label: "Categories"
                name: "categories"
                widget: "list"
                required: false
                fields:
                  - {
                      label: "Hide this category",
                      name: "isHidden",
                      widget: "boolean",
                      default: false,
                      required: false,
                    }
                  - label: "Category"
                    name: "category"
                    widget: "select"
                    required: false
                    options:
                      [
                        "clergy",
                        "staff",
                        "catechist",
                        "council",
                        "music",
                        "ministries",
                      ]
              - { label: "Photo", name: "photo", widget: "image" , required: false }
              - {
                  label: "Photo Position (e.g. center 25%)",
                  name: "photoPosition",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Photo Fit",
                  name: "photoFit",
                  widget: "select",
                  options: ["cover", "contain"],
                  required: false,
                }
              - {
                  label: "Directory Card Photo Aspect Ratio",
                  name: "photoAspect",
                  widget: "select",
                  options: ["2/3", "3/4", "1/1"],
                  default: "2/3",
                  hint: "Controls the portrait image area on the About & Staff directory cards.",
                  required: false,
                }
              - { label: "Duties", name: "duties", widget: "markdown" , required: false }
              - { label: "Bio", name: "bio", widget: "markdown" , required: false }
      - file: "client/src/data/about_page_data.json"
        label: "About Page Text"
        name: "about_page_text"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "markdown" , required: false }
          - { label: "Headline", name: "title", widget: "markdown" , required: false }
          - { label: "Description", name: "description", widget: "markdown" , required: false }
          - { label: "Quote", name: "quote", widget: "markdown" , required: false }
          - {
              label: "Quote Attribution",
              name: "quoteAttribution",
              widget: "markdown",
              required: false,
            }
          - label: "About Page Photo Carousel"
            name: "gallery"
            widget: "list"
            required: false
            summary: "{{fields.caption}}"
            fields:
              - { label: "Photo", name: "photo", widget: "image", required: true }
              - { label: "Caption", name: "caption", widget: "markdown", required: false }
              - { label: "Link URL (optional)", name: "linkUrl", widget: "string", required: false }
              - {
                  label: "Include in carousel",
                  name: "showInCarousel",
                  widget: "boolean",
                  default: true,
                  required: false,
                }
  - name: "one_time_events"
    label: "Parish Events · One-Time Events"
    folder: "client/src/components/eventfolders/one-time-events"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}-{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}"
    summary: "{{title}} · {{date}}"
    sortable_fields:
      - field: "date"
        label: "Event date (oldest/newest)"
        default_sort: "asc"
    fields:
      - {
          label: "Hide this event",
          name: "isHidden",
          widget: "boolean",
          default: false,
          required: false,
        }
      - { label: "Automatic event ID", name: "id", widget: "hidden", required: false }
      - {
          label: "Title",
          name: "title",
          widget: "markdown",
          required: false,
          hint: "Use this collection for a separate one-time event, including an additional event on a recurring Mass date.",
        }
      - {
          label: "Date",
          name: "date",
          widget: "datetime",
          format: "YYYY-MM-DD",
          date_format: "YYYY-MM-DD",
          time_format: false,
          picker_utc: false,
          required: false,
          hint: "To create another event with these details, choose Publish and Duplicate from the publish menu, then update the date and location. The duplicate keeps the same custom landing page.",
        }
      - { label: "Time", name: "time", widget: "string" , required: false }
      - { label: "Location", name: "location", widget: "markdown" , required: false }
      - label: "Categories"
        name: "categories"
        widget: "list"
        required: false
        fields:
          - {
              label: "Hide this category",
              name: "isHidden",
              widget: "boolean",
              default: false,
              required: false,
            }
          - label: "Category"
            name: "category"
            widget: "select"
            required: false
            options:
              [
                "sacramental",
                "parishEvents",
                "meeting",
                "vocations",
                "diocesan",
              ]
      - label: "Organization Calendars (Optional)"
        name: "organizationTags"
        widget: "list"
        required: false
        hint: "Recurring events tagged Faith Formation open the shared Wednesday Faith Formation landing page when clicked."
        field:
          label: "Organization"
          name: "organization"
          widget: "select"
          required: false
          options:
            - { label: "Knights of Columbus", value: "knights-of-columbus" }
            - { label: "Altar Society", value: "altar-society" }
            - { label: "Catholic Daughters", value: "catholic-daughters" }
            - { label: "St. Vincent de Paul", value: "st-vincent-de-paul" }
            - { label: "Faith Formation", value: "faith-formation" }
      - {
          label: "Description",
          name: "description",
          widget: "markdown",
          required: false,
        }
      - {
          label: "About this event",
          name: "about",
          widget: "markdown",
          required: false,
        }
      - {
          label: "Sign-up URL",
          name: "signupLink",
          widget: "string",
          required: false,
        }
      - {
          label: "Contact Person",
          name: "contactPerson",
          widget: "markdown",
          required: false,
        }
      - {
          label: "Contact Email",
          name: "contactEmail",
          widget: "string",
          required: false,
        }
      - {
          label: "Contact Phone",
          name: "contactPhone",
          widget: "string",
          required: false,
        }
      - label: "Event Photos (Flyers and Gallery)"
        name: "gallery"
        widget: "list"
        required: false
        hint: "Add flyers and pictures here; included photos appear in both the carousel and gallery. Turn off Include in carousel to show a picture only in the gallery."
        summary: "{{fields.caption}}"
        fields:
          - {
              label: "Hide this photo",
              name: "isHidden",
              widget: "boolean",
              default: false,
              required: false,
            }
          - { label: "Photo", name: "photo", widget: "image" , required: false }
          - {
              label: "Caption",
              name: "caption",
              widget: "markdown",
              required: false,
            }
          - {
              label: "Link URL (optional)",
              name: "linkUrl",
              widget: "string",
              required: false,
              hint: "Use a site path such as /about or a full https:// URL. Leave blank to open the photo.",
            }
          - {
              label: "Include in carousel",
              name: "showInCarousel",
              widget: "boolean",
              default: true,
              required: false,
              hint: "Turn off to show this photo only in the Event Gallery.",
            }
      - label: "Frequently Asked Questions (Optional)"
        name: "faqItems"
        widget: "list"
        required: false
        fields:
          - {
              label: "Hide this question",
              name: "isHidden",
              widget: "boolean",
              default: false,
              required: false,
            }
          - { label: "Question", name: "question", widget: "markdown" , required: false }
          - { label: "Answer", name: "answer", widget: "markdown" , required: false }

  - name: "recurring_events"
    label: "Parish Events · Recurring Events"
    folder: "client/src/components/eventfolders/recurring-events"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}-{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}"
    summary: "{{title}}"
    sortable_fields:
      - field: "schedule.startDate"
        label: "Schedule start date (oldest/newest)"
        default_sort: "asc"
    fields:
      - {
          label: "Hide this recurring event",
          name: "isHidden",
          widget: "boolean",
          default: false,
          required: false,
        }
      - { label: "Automatic rule ID", name: "id", widget: "hidden", required: false }
      - {
          label: "Event Title",
          name: "title",
          widget: "markdown",
          required: false,
          hint: "Top-level event details are shared by every occurrence. Use Schedule, Previews, and Exceptions to customize or cancel one occurrence; use One-Time Events to add a separate event on the same date.",
        }
      - { label: "Time", name: "time", widget: "string" , required: false }
      - { label: "Location", name: "location", widget: "markdown" , required: false }
      - label: "Schedule, Previews, and Exceptions"
        name: "schedule"
        widget: "recurrence-schedule"
        required: false
        hint: "Choose a date range and pattern. Edit this date changes this event's occurrence (including its title); it does not add a second event. Use Parish Events · One-Time Events for a separate event on the same date."
      - label: "Additional schedule sets"
        name: "additionalSchedules"
        widget: "list"
        required: false
        summary: "{{time}}"
        hint: "Add another time or recurrence pattern for this same event, such as a Saturday Mass alongside the weekday schedule above."
        fields:
          - { label: "Time", name: "time", widget: "string", required: false }
          - label: "Schedule, Previews, and Exceptions"
            name: "schedule"
            widget: "recurrence-schedule"
            required: false
      - {
          label: "Description",
          name: "description",
          widget: "markdown",
          required: false,
        }
      - {
          label: "About this event",
          name: "about",
          widget: "markdown",
          required: false,
        }
      - {
          label: "Sign-up URL",
          name: "signupLink",
          widget: "string",
          required: false,
        }
      - {
          label: "Contact Person",
          name: "contactPerson",
          widget: "markdown",
          required: false,
        }
      - {
          label: "Contact Email",
          name: "contactEmail",
          widget: "string",
          required: false,
        }
      - {
          label: "Contact Phone",
          name: "contactPhone",
          widget: "string",
          required: false,
        }
      - label: "Categories"
        name: "categories"
        widget: "list"
        required: false
        fields:
          - {
              label: "Hide this category",
              name: "isHidden",
              widget: "boolean",
              default: false,
              required: false,
            }
          - label: "Category"
            name: "category"
            widget: "select"
            required: false
            options:
              [
                "sacramental",
                "parishEvents",
                "meeting",
                "vocations",
                "diocesan",
              ]
      - label: "Organization Calendars (Optional)"
        name: "organizationTags"
        widget: "list"
        required: false
        field:
          label: "Organization"
          name: "organization"
          widget: "select"
          required: false
          options:
            - { label: "Knights of Columbus", value: "knights-of-columbus" }
            - { label: "Altar Society", value: "altar-society" }
            - { label: "Catholic Daughters", value: "catholic-daughters" }
            - { label: "St. Vincent de Paul", value: "st-vincent-de-paul" }
            - { label: "Faith Formation", value: "faith-formation" }
      - label: "Event Photos (Flyers and Gallery)"
        name: "gallery"
        widget: "list"
        required: false
        hint: "Add flyers and pictures here; included photos appear in each occurrence's carousel and gallery. Turn off Include in carousel to show a picture only in the gallery."
        summary: "{{fields.caption}}"
        fields:
          - {
              label: "Hide this photo",
              name: "isHidden",
              widget: "boolean",
              default: false,
              required: false,
            }
          - { label: "Photo", name: "photo", widget: "image" , required: false }
          - {
              label: "Caption",
              name: "caption",
              widget: "markdown",
              required: false,
            }
          - {
              label: "Link URL (optional)",
              name: "linkUrl",
              widget: "string",
              required: false,
              hint: "Use a site path such as /about or a full https:// URL. Leave blank to open the photo.",
            }
          - {
              label: "Include in carousel",
              name: "showInCarousel",
              widget: "boolean",
              default: true,
              required: false,
              hint: "Turn off to show this photo only in the Event Gallery.",
            }
      - label: "Frequently Asked Questions (Optional)"
        name: "faqItems"
        widget: "list"
        required: false
        fields:
          - {
              label: "Hide this question",
              name: "isHidden",
              widget: "boolean",
              default: false,
              required: false,
            }
          - { label: "Question", name: "question", widget: "markdown" , required: false }
          - { label: "Answer", name: "answer", widget: "markdown", required: false }
          - {
              label: "Link URL (optional)",
              name: "linkUrl",
              widget: "string",
              required: false,
              hint: "Use a site path such as /about or a full https:// URL. Leave blank to open the photo.",
            }

  - name: "bulletins"
    label: "Parish Bulletins"
    files:
      - file: "client/src/data/bulletins_data.json"
        label: "Weekly Bulletins"
        name: "bulletins_file"
        fields:
          - label: "Bulletins List"
