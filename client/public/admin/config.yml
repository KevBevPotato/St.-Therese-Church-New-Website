                }
              - {
                  label: "Needs",
                  name: "needs",
                  widget: "markdown",
                  required: false,
                }
              - {
                  label: "Sponsors",
                  name: "sponsors",
                  widget: "markdown",
                  required: false,
                }
  - name: "staff"
    label: "Staff Directory"
    files:
      - file: "client/src/data/staff_data.json"
        label: "Staff List"
        name: "staff_file"
        fields:
          - label: "Staff Members"
            name: "staff"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - {
                  label: "Full Name",
                  name: "name",
                  widget: "string",
                  required: true,
                } # MOVED TO TOP
              - {
                  label: "Hide from Directory",
                  name: "isHidden",
                  widget: "boolean",
                  defaultValue: false,
                }
              - {
                  label: "Slug (no spaces, e.g. kevin-baltzer)",
                  name: "slug",
                  widget: "string",
                  required: true,
                }
              - label: "Titles"
                name: "titles"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Phone", name: "phone", widget: "string" }
              - { label: "Office Room", name: "officeRoom", widget: "string" }
              - label: "Categories"
                name: "categories"
                widget: "list"
                fields:
                  - label: "Category"
                    name: "category"
                    widget: "select"
                    options:
                      [
                        "clergy",
                        "staff",
                        "catechist",
                        "council",
                        "music",
                        "ministries",
                      ]
              - { label: "Photo", name: "photo", widget: "image" }
              - {
                  label: "Photo Position (e.g. center 25%)",
                  name: "photoPosition",
                  widget: "string",
                }
              - {
                  label: "Photo Fit",
                  name: "photoFit",
                  widget: "select",
                  options: ["cover", "contain"],
                }
              - { label: "Duties", name: "duties", widget: "text" }
              - { label: "Bio", name: "bio", widget: "text" }
  - name: "homepage"
    label: "Home Page"
    files:
      - file: "client/src/data/hero_data.json"
        label: "Hero Video"
        name: "hero_video"
        fields:
          - {
              label: "Hero Video File or URL",
              name: "videoUrl",
              widget: "file",
              required: false,
              hint: "Upload an MP4 or choose an existing video. Leave blank to show the poster image only.",
            }
          - {
              label: "Fallback Poster Image",
              name: "poster",
              widget: "image",
              required: false,
            }
          - {
              label: "Media Fit",
              name: "mediaFit",
              widget: "select",
              options:
                [
                  {
                    label: "Cover — fills the hero; edges may be cropped",
                    value: "cover",
                  },
                  {
                    label: "Contain — shows the whole image; may leave empty space",
                    value: "contain",
                  },
                ],
              default: "cover",
              hint: "Controls how the video or poster fits inside the hero area.",
            }
          - {
              label: "Media Position",
              name: "mediaPosition",
              widget: "select",
              options: ["center", "top", "bottom", "left", "right"],
              default: "center",
              hint: "Choose which part stays visible when Media Fit is set to Cover.",
            }
          - {
              label: "Background Color",
              name: "backgroundColor",
              widget: "color",
              default: "#102a45",
              hint: "Shown behind the media, especially when it is set to Contain.",
            }
          - {
              label: "Overlay Color",
              name: "overlayColor",
              widget: "color",
              default: "#102a45",
              hint: "Tint placed over the media to keep the text readable.",
            }
          - {
              label: "Overlay Strength",
              name: "overlayStrength",
              widget: "number",
              value_type: "float",
              min: 0,
              max: 1,
              step: 0.05,
              default: 0.9,
              hint: "0 is transparent; 1 is strongest. Increase it if the text is hard to read.",
            }
          - {
              label: "Text Color",
              name: "textColor",
              widget: "color",
              default: "#ffffff",
            }
          - {
              label: "Accent Color",
              name: "accentColor",
              widget: "color",
              default: "#f1d99d",
            }
          - {
              label: "Accent Border Color",
              name: "accentBorderColor",
              widget: "color",
              default: "#d4b36a",
            }
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Headline", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - {
              label: "Primary Button Label",
              name: "primaryButtonLabel",
              widget: "string",
            }
          - {
              label: "Primary Button URL",
              name: "primaryButtonUrl",
              widget: "string",
            }
          - {
              label: "Secondary Button Label",
              name: "secondaryButtonLabel",
              widget: "string",
            }
          - {
              label: "Secondary Button URL",
              name: "secondaryButtonUrl",
              widget: "string",
            }
          - { label: "Quote", name: "quote", widget: "string" }
          - {
              label: "Quote Attribution",
              name: "quoteAttribution",
              widget: "string",
            }
  - name: "resources"
    label: "Resource Page"
    files:
      - file: "client/src/data/resources_data.json"
        label: "Resource Categories and Cards"
        name: "resources_file"
        fields:
          - label: "Page Settings"
            name: "settings"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Page Title", name: "title", widget: "string" }
              - { label: "Introduction", name: "introduction", widget: "text" }
              - { label: "Quote", name: "quote", widget: "text" }
              - {
                  label: "Quote Attribution",
                  name: "quoteAttribution",
                  widget: "string",
                }
          - label: "Resource Categories (drag to reorder)"
            name: "categories"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {
                  label: "Category ID (URL-safe)",
                  name: "id",
                  widget: "string",
                  hint: "Keep existing IDs unchanged so category anchors remain stable.",
                }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Resource Cards (drag to reorder)"
                name: "links"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - {
                      label: "Card ID (URL-safe)",
                      name: "id",
                      widget: "string",
                    }
                  - { label: "Title", name: "title", widget: "string" }
                  - {
                      label: "Description",
                      name: "description",
                      widget: "text",
                    }
                  - {
                      label: "Link URL (internal path or external URL)",
                      name: "href",
                      widget: "string",
                      required: false,
                    }
                  - {
                      label: "External Link",
                      name: "external",
                      widget: "boolean",
                      default: false,
                    }
                  - {
                      label: "Card Background Image (optional)",
                      name: "image",
                      widget: "image",
                      required: false,
                    }
                  - {
                      label: "App Logo Image (optional)",
                      name: "iconImage",
                      widget: "image",
                      required: false,
                    }
                  - {
                      label: "Fallback Icon",
                      name: "icon",
                      widget: "select",
                      options:
                        [
                          "BookOpen",
                          "Calendar",
                          "Church",
                          "FileText",
                          "GraduationCap",
                          "Heart",
                          "HelpCircle",
                          "Phone",
                          "Shield",
                          "Users",
                        ],
                      default: "BookOpen",
                    }
                  - label: "Background Image Appearance"
                    name: "imageSettings"
                    widget: "object"
                    required: false
                    fields:
                      - {
                          label: "Image Size",
                          name: "scale",
                          widget: "select",
                          options:
                            [
                              "scale-100",
                              "scale-110",
                              "scale-125",
                              "scale-150",
                            ],
                          default: "scale-100",
                        }
                      - {
                          label: "Image Transparency",
                          name: "opacity",
                          widget: "select",
                          options:
                            [
                              "opacity-10",
                              "opacity-20",
                              "opacity-30",
                              "opacity-40",
                              "opacity-60",
                            ],
                          default: "opacity-40",
                        }
                      - {
                          label: "Image Position",
                          name: "position",
                          widget: "select",
                          options:
                            [
                              "object-center",
                              "object-top",
                              "object-bottom",
                              "object-left",
                              "object-right",
                            ],
                          default: "object-center",
                        }
                      - {
                          label: "Background Blur",
                          name: "blur",
                          widget: "select",
                          options:
                            [
                              "backdrop-blur-none",
                              "backdrop-blur-[2px]",
                              "backdrop-blur-sm",
                              "backdrop-blur-md",
                              "backdrop-blur-lg",
                            ],
                          default: "backdrop-blur-[2px]",
                        }
                  - label: "Logo Appearance"
                    name: "logoSettings"
                    widget: "object"
                    required: false
                    fields:
                      - {
                          label: "Logo Size",
                          name: "scale",
                          widget: "select",
                          options:
                            [
                              "size-8",
                              "size-10",
                              "size-12",
                              "size-14",
                              "size-16",
                            ],
                          default: "size-12",
                        }
                      - {
                          label: "Logo Shape",
                          name: "rounded",
                          widget: "select",
                          options:
                            [
                              "rounded-none",
                              "rounded-sm",
                              "rounded-md",
                              "rounded-lg",
                              "rounded-xl",
                              "rounded-2xl",
                              "rounded-full",
                            ],
                          default: "rounded-xl",
                        }
                      - {
                          label: "Logo Border",
                          name: "border",
                          widget: "select",
                          options:
                            [
                              "border-none",
                              "border-primary/10",
                              "border-white",
                              "border-accent",
                            ],
                          default: "border-primary/10",
                        }
                      - {
                          label: "Logo Opacity",
                          name: "opacity",
                          widget: "select",
                          options: ["opacity-50", "opacity-80", "opacity-100"],
                          default: "opacity-100",
                        }
